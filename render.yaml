services:
  - type: web
    name: campus-compass
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: campus-compass-data
      mountPath: /app/data/uploads
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: ADMIN_UPLOAD_TOKEN
        sync: false
